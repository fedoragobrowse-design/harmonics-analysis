name: Build release assets
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  windows:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r windows-requirements.txt
      - run: choco install ffmpeg -y --no-progress
      - shell: pwsh
        run: |
          $ffmpeg = (Get-Command ffmpeg).Source
          pyinstaller --noconfirm --clean --windowed --onefile --name "Harmonics Analysis" --hidden-import sounddevice --collect-binaries sounddevice --add-binary "$ffmpeg;." harmonic-viewer.py
          pyinstaller --noconfirm --clean --console --onefile --name "Harmonics Analysis MCP" --add-data "harmonic-viewer.py;." --hidden-import cmath --hidden-import dataclasses --hidden-import hashlib --hidden-import json --hidden-import math --hidden-import queue --hidden-import shutil --hidden-import struct --hidden-import subprocess --hidden-import tempfile --hidden-import threading --hidden-import time --hidden-import tkinter --hidden-import urllib.request harmonics-mcp.py
          '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | & "dist/Harmonics Analysis MCP.exe" | Select-String '"version": "1.6.1"'
      - name: Require a signing certificate for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && (env.WINDOWS_CERTIFICATE_BASE64 == '' || env.WINDOWS_CERTIFICATE_PASSWORD == '')
        shell: pwsh
        run: throw "Tagged Windows releases require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD secrets."
      - name: Sign and verify Windows executables
        if: env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "harmonics-analysis-signing.pfx"
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signTool) { throw "signtool.exe was not found on the Windows runner." }
          & $signTool sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "dist/Harmonics Analysis.exe" "dist/Harmonics Analysis MCP.exe"
          if ($LASTEXITCODE -ne 0) { throw "Windows executable signing failed." }
          & $signTool verify /pa /v "dist/Harmonics Analysis.exe" "dist/Harmonics Analysis MCP.exe"
          if ($LASTEXITCODE -ne 0) { throw "Windows signature verification failed." }
          Copy-Item "dist/Harmonics Analysis.exe" "Harmonics-Analysis-Windows.exe"
          Copy-Item "dist/Harmonics Analysis MCP.exe" "Harmonics-Analysis-MCP-Windows.exe"
          $hash = (Get-FileHash "Harmonics-Analysis-Windows.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "Harmonics-Analysis-Windows.exe.sha256" -Value "$hash  Harmonics-Analysis-Windows.exe" -NoNewline
          $mcpHash = (Get-FileHash "Harmonics-Analysis-MCP-Windows.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "Harmonics-Analysis-MCP-Windows.exe.sha256" -Value "$mcpHash  Harmonics-Analysis-MCP-Windows.exe" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonics-Analysis-Windows
          path: |
            Harmonics-Analysis-Windows.exe
            Harmonics-Analysis-Windows.exe.sha256
            Harmonics-Analysis-MCP-Windows.exe
            Harmonics-Analysis-MCP-Windows.exe.sha256
  debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x build-deb.sh && ./build-deb.sh
      - run: sha256sum harmonics-analysis_1.6.1_all.deb > harmonics-analysis_1.6.1_all.deb.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Harmonics-Analysis-Debian
          path: |
            harmonics-analysis_1.6.1_all.deb
            harmonics-analysis_1.6.1_all.deb.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, debian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
